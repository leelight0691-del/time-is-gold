<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>24시 원형 생활계획표</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // PWA 설정 및 아이콘 생성 (기존 로직 유지)
    function generateAppIcon() {
      const c = document.createElement('canvas');
      c.width = 192; c.height = 192;
      const x = c.getContext('2d');
      x.fillStyle = '#3B7A57';
      x.beginPath(); x.arc(96, 96, 96, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#FFFFFF';
      x.beginPath(); x.arc(96, 96, 75, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#F4D03F';
      x.beginPath(); x.moveTo(96,96); x.arc(96, 96, 75, -Math.PI/2, 0); x.closePath(); x.fill();
      x.strokeStyle = '#3B7A57'; x.lineWidth = 8;
      x.beginPath(); x.moveTo(96, 96); x.lineTo(96, 45); x.stroke();
      x.beginPath(); x.moveTo(96, 96); x.lineTo(135, 96); x.stroke();
      return c.toDataURL('image/png');
    }
    const iconDataUrl = generateAppIcon();
    const manifest = {
      name: "24시 원형 생활계획표",
      short_name: "생활계획표",
      start_url: "./",
      display: "standalone",
      background_color: "#F5F9F0",
      theme_color: "#3B7A57",
      icons: [{ src: iconDataUrl, sizes: "192x192", type: "image/png" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = manifestUrl;
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], {type: 'text/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  </script>

  <style>
    @font-face {
      font-family: 'GmarketSansBold';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
      font-weight: normal; font-style: normal;
    }
    :root {
      --bg-cream: #F5F9F0; --card-bg: #FFFFFF; --primary-green: #3B7A57;
      --light-green: #E2EFE0; --accent-yellow: #F4D03F; --soft-yellow: #FEF9E7;
      --btn-green: #40826D; --btn-reset: #FADBD8; --reset-text: #B03A2E;
      --text-dark: #2C3E50; --text-muted: #7F8C8D; --border-color: #E5E8E8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'GmarketSansBold', 'Gowun Dodum', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-cream); color: var(--text-dark); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 10px; }
    .app-wrapper { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 28px; box-shadow: 0 10px 30px rgba(60, 90, 60, 0.08); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #E2EAD8; margin-bottom: 20px; }

    .tab-header { display: flex; background: #EDF4EA; padding: 6px; margin: 12px 12px 0 12px; border-radius: 20px; }
    .tab-btn { flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 0.95rem; color: var(--primary-green); border-radius: 16px; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { background: var(--card-bg); color: var(--primary-green); font-weight: bold; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05); }
    .tab-content { display: none; padding: 12px; }
    .tab-content.active { display: block; }

    /* 날짜 컨트롤 바 - 모바일 최적화 */
    .date-nav-bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 12px; border: 1px solid #EEF3E9; }
    .nav-arrow { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-yellow); border: none; display: flex; align-items: center; justify-content: center; color: #7D6608; cursor: pointer; }
    .date-display { text-align: center; min-width: 100px; }
    .date-title { font-size: 0.95rem; color: var(--primary-green); line-height: 1.2; }
    .date-subtitle { font-size: 0.7rem; color: var(--text-muted); }

    /* 하단 버튼들 한 줄 정렬 */
    .btn-action-group { display: flex; justify-content: center; gap: 4px; margin-bottom: 15px; padding: 0 12px; }
    .btn-action-group button { flex: 1; border: none; padding: 8px 2px; border-radius: 12px; font-size: 0.72rem; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .btn-today { background: var(--btn-green); color: white; }
    .btn-import { background: #E2EFE0; color: #2D4A3E; border: 1px solid #C5D9C1 !important; }
    .btn-reset { background: var(--btn-reset); color: var(--reset-text); }

    .clock-wrapper { position: relative; width: 100%; aspect-ratio: 1; max-width: 340px; margin: 0 auto 15px auto; }
    #clockCanvas { width: 100%; height: 100%; }

    .add-form-card { background: #F8FAF6; border: 1px solid #E1EBE0; border-radius: 18px; padding: 14px; margin-bottom: 15px; }
    .form-title { font-size: 0.85rem; color: var(--primary-green); margin-bottom: 10px; font-weight: bold; }
    .time-picker-row { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; justify-content: space-between; }
    .time-select-group { display: flex; align-items: center; gap: 2px; background: white; border: 1px solid #D5E1D3; padding: 4px 6px; border-radius: 10px; }
    .time-select-group select { border: none; font-size: 0.85rem; outline: none; }
    .task-input-row { display: flex; gap: 6px; }
    .task-input-row input { flex: 1; border: 1px solid #D5E1D3; padding: 10px; border-radius: 12px; font-size: 0.85rem; outline: none; }
    .btn-submit { background: var(--btn-green); color: white; border: none; padding: 0 12px; border-radius: 12px; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
    .btn-cancel { background: #CBD5E1; color: white; border: none; padding: 0 10px; border-radius: 12px; font-size: 0.82rem; cursor: pointer; display: none; }

    .todo-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
    .todo-item { display: flex; align-items: center; justify-content: space-between; background: #FAFCFA; border: 1px solid #E6EFE4; padding: 8px 10px; border-radius: 14px; }
    .todo-left { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .todo-checkbox { width: 18px; height: 18px; accent-color: var(--btn-green); flex-shrink: 0; }
    .todo-badge { background: #FEF3C7; color: #92400E; font-size: 0.7rem; padding: 2px 5px; border-radius: 6px; flex-shrink: 0; }
    .todo-text { font-size: 0.82rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .todo-text.completed { text-decoration: line-through; color: #A0AEC0; }
    .todo-actions { display: flex; gap: 4px; }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 4px; font-size: 0.85rem; }
    .btn-edit { color: var(--btn-green); }
    .btn-delete { color: #E53E3E; }

    /* 대시보드 스타일 생략 (기존과 동일) */
    .stat-card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { background: #F4F9F2; border: 1px solid #E0ECE0; border-radius: 16px; padding: 14px; text-align: center; }
    .stat-val { font-size: 1.6rem; color: var(--primary-green); margin: 6px 0; font-weight: bold; }
    .chart-box { background: white; border: 1px solid #E6EFE4; border-radius: 16px; padding: 12px; height: 180px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('planner')"><i class="fa-solid fa-clock"></i> 계획표</button>
      <button class="tab-btn" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> 통계</button>
    </div>

    <div id="plannerTab" class="tab-content active">
      <div class="date-nav-bar">
        <button class="nav-arrow" onclick="changeDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="date-display">
          <div class="date-title" id="dateTitle">2026.08.11 (화)</div>
          <div class="date-subtitle" id="dateSubtitle">오늘</div>
        </div>
        <button class="nav-arrow" onclick="changeDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <div class="btn-action-group">
        <button class="btn-today" onclick="goToday()">오늘로</button>
        <button class="btn-import" onclick="importYesterday()">어제 일정 불러오기</button>
        <button class="btn-reset" onclick="resetCurrentDate()">이 날 초기화</button>
      </div>

      <div class="clock-wrapper">
        <canvas id="clockCanvas" width="360" height="360"></canvas>
      </div>

      <div class="add-form-card">
        <div class="form-title" id="formLabel"><i class="fa-solid fa-plus-circle"></i> 새 일정 추가</div>
        <div class="time-picker-row">
          <div class="time-select-group"><select id="startHour"></select>시 <select id="startMin"></select>분</div>
          <span style="color:#A0AEC0;">~</span>
          <div class="time-select-group"><select id="endHour"></select>시 <select id="endMin"></select>분</div>
        </div>
        <div class="task-input-row">
          <input type="text" id="taskTitle" placeholder="할 일을 입력하세요">
          <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()">취소</button>
          <button class="btn-submit" id="btnSubmit" onclick="handleTaskSubmit()">추가</button>
        </div>
      </div>

      <div id="todoList" class="todo-list"></div>
    </div>

    <div id="dashboardTab" class="tab-content">
      <div class="stat-card-row">
        <div class="stat-card"><div style="font-size:0.75rem">주간 달성률</div><div class="stat-val" id="weeklyRate">0%</div></div>
        <div class="stat-card" style="background:#FEFBF0"><div style="font-size:0.75rem">취약 시간대</div><div class="stat-val" id="weakestHour" style="color:#D97706">--시</div></div>
      </div>
      <div class="chart-box"><canvas id="weeklyChart"></canvas></div>
      <div class="chart-box"><canvas id="hourlyChart"></canvas></div>
    </div>
  </div>

  <script>
    const PASTEL_COLORS = ['#D1FAE5', '#FEF3C7', '#FFEDD5', '#E0F2FE', '#E9D5FF', '#FCE7F3', '#CCFBF1', '#FEF9C3'];
    let currentDateObj = new Date();
    let appData = JSON.parse(localStorage.getItem('lifePlanData_v2')) || {};
    let editingId = null;

    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const outerRadius = 150;
    const innerRadius = 55;

    window.onload = () => {
      initTimeSelectors();
      updateDateDisplay();
    };

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function initTimeSelectors() {
      const sh = document.getElementById('startHour'), eh = document.getElementById('endHour');
      const sm = document.getElementById('startMin'), em = document.getElementById('endMin');
      sh.innerHTML = ''; eh.innerHTML = ''; sm.innerHTML = ''; em.innerHTML = '';
      for (let i = 0; i < 24; i++) {
        const h = String(i).padStart(2, '0');
        sh.innerHTML += `<option value="${i}">${h}</option>`;
        eh.innerHTML += `<option value="${i}">${h}</option>`;
      }
      for (let i = 0; i < 60; i += 10) {
        const m = String(i).padStart(2, '0');
        sm.innerHTML += `<option value="${i}">${m}</option>`;
        em.innerHTML += `<option value="${i}">${m}</option>`;
      }
      eh.value = "1";
    }

    function updateDateDisplay() {
      const key = formatDateKey(currentDateObj);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = days[currentDateObj.getDay()];
      document.getElementById('dateTitle').innerText = `${key.replace(/-/g,'.')} (${dayName})`;
      
      const todayKey = formatDateKey(new Date());
      const sub = document.getElementById('dateSubtitle');
      if (key === todayKey) sub.innerText = '오늘';
      else {
        const diff = Math.round((currentDateObj - new Date().setHours(0,0,0,0)) / 86400000);
        sub.innerText = diff > 0 ? `${diff}일 후` : `${Math.abs(diff)}일 전`;
      }
      saveData();
    }

    function changeDate(delta) { currentDateObj.setDate(currentDateObj.getDate() + delta); cancelEdit(); updateDateDisplay(); }
    function goToday() { currentDateObj = new Date(); cancelEdit(); updateDateDisplay(); }

    function resetCurrentDate() {
      if (confirm('이 날의 모든 일정을 초기화할까요?')) {
        appData[formatDateKey(currentDateObj)] = [];
        saveData();
      }
    }

    function importYesterday() {
      const yesterday = new Date(currentDateObj);
      yesterday.setDate(yesterday.getDate() - 1);
      const yKey = formatDateKey(yesterday);
      const todayKey = formatDateKey(currentDateObj);
      
      if (!appData[yKey] || appData[yKey].length === 0) {
        alert('어제 저장된 일정이 없습니다.');
        return;
      }
      if (confirm('어제 일정을 오늘로 모두 불러올까요? (현재 오늘 일정은 유지됩니다)')) {
        const clonedTasks = appData[yKey].map(t => ({...t, id: Date.now() + Math.random(), completed: false}));
        appData[todayKey] = [...(appData[todayKey] || []), ...clonedTasks];
        saveData();
      }
    }

    function handleTaskSubmit() {
      const title = document.getElementById('taskTitle').value.trim();
      const sH = parseInt(document.getElementById('startHour').value);
      const sM = parseInt(document.getElementById('startMin').value);
      const eH = parseInt(document.getElementById('endHour').value);
      const eM = parseInt(document.getElementById('endMin').value);

      if (!title) { alert('할 일을 입력해주세요!'); return; }
      if ((sH*60+sM) >= (eH*60+eM)) { alert('종료 시간은 시작 시간보다 나중이어야 합니다.'); return; }

      const key = formatDateKey(currentDateObj);
      if (!appData[key]) appData[key] = [];

      if (editingId) {
        const idx = appData[key].findIndex(t => t.id === editingId);
        if (idx > -1) appData[key][idx] = { ...appData[key][idx], title, startH:sH, startM:sM, endH:eH, endM:eM };
        cancelEdit();
      } else {
        appData[key].push({ id: Date.now(), title, startH:sH, startM:sM, endH:eH, endM:eM, completed: false });
      }
      document.getElementById('taskTitle').value = '';
      saveData();
    }

    function editTask(id) {
      const task = appData[formatDateKey(currentDateObj)].find(t => t.id === id);
      if (!task) return;
      editingId = id;
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('startHour').value = task.startH;
      document.getElementById('startMin').value = task.startM;
      document.getElementById('endHour').value = task.endH;
      document.getElementById('endMin').value = task.endM;
      document.getElementById('formLabel').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 일정 수정 중';
      document.getElementById('btnSubmit').innerText = '수정 완료';
      document.getElementById('btnCancel').style.display = 'block';
      document.getElementById('taskTitle').focus();
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('taskTitle').value = '';
      document.getElementById('formLabel').innerHTML = '<i class="fa-solid fa-plus-circle"></i> 새 일정 추가';
      document.getElementById('btnSubmit').innerText = '추가';
      document.getElementById('btnCancel').style.display = 'none';
    }

    function toggleTask(id) {
      const key = formatDateKey(currentDateObj);
      const task = appData[key].find(t => t.id === id);
      if (task) { task.completed = !task.completed; saveData(); }
    }

    function deleteTask(id) {
      const key = formatDateKey(currentDateObj);
      appData[key] = appData[key].filter(t => t.id !== id);
      saveData();
    }

    function saveData() {
      localStorage.setItem('lifePlanData_v2', JSON.stringify(appData));
      drawClock();
      renderTodoList();
    }

    function drawClock() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const tasks = appData[formatDateKey(currentDateObj)] || [];

      // 배경 링
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
      ctx.arc(centerX, centerY, innerRadius, Math.PI * 2, 0, true);
      ctx.fillStyle = '#EAF4E8'; ctx.fill();

      tasks.forEach((task, idx) => {
        const sMins = task.startH * 60 + task.startM;
        const eMins = task.endH * 60 + task.endM;
        let sAngle = (sMins / 1440) * Math.PI * 2 - Math.PI / 2;
        let eAngle = (eMins / 1440) * Math.PI * 2 - Math.PI / 2;
        if (eMins <= sMins) eAngle += Math.PI * 2;

        ctx.beginPath();
        ctx.arc(centerX, centerY, outerRadius, sAngle, eAngle);
        ctx.arc(centerX, centerY, innerRadius, eAngle, sAngle, true);
        ctx.closePath();
        ctx.fillStyle = PASTEL_COLORS[idx % PASTEL_COLORS.length];
        ctx.globalAlpha = task.completed ? 0.35 : 0.95;
        ctx.fill(); ctx.globalAlpha = 1.0;

        // 글자 그리기
        const midA = (sAngle + eAngle) / 2;
        const midR = (outerRadius + innerRadius) / 2;
        const tx = centerX + Math.cos(midA) * midR;
        const ty = centerY + Math.sin(midA) * midR;
        
        if ((eMins - sMins) >= 20 || (eMins + 1440 - sMins) >= 20) {
          ctx.save();
          ctx.fillStyle = '#2D4A3E';
          ctx.font = '11px GmarketSansBold';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(task.title, tx, ty);
          
          // 완료 시 취소선 긋기
          if (task.completed) {
            const tw = ctx.measureText(task.title).width;
            ctx.beginPath();
            ctx.moveTo(tx - tw/2, ty);
            ctx.lineTo(tx + tw/2, ty);
            ctx.strokeStyle = '#2D4A3E'; ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.restore();
        }
      });

      // 시계 숫자 및 가운데 완료율 원 그리기 (기존 로직)
      ctx.fillStyle = '#5A7365'; ctx.font = '11px GmarketSansBold'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let h = 0; h < 24; h += 3) {
        const a = (h / 24) * Math.PI * 2 - Math.PI / 2;
        ctx.fillText(`${h}시`, centerX + Math.cos(a) * (outerRadius+15), centerY + Math.sin(a) * (outerRadius+15));
      }
      ctx.beginPath(); ctx.arc(centerX, centerY, innerRadius-2, 0, Math.PI*2); ctx.fillStyle='#FFF'; ctx.fill();
      const done = tasks.filter(t => t.completed).length;
      const rate = tasks.length > 0 ? Math.round((done / tasks.length)*100) : 0;
      ctx.fillStyle = '#3B7A57'; ctx.font='bold 18px GmarketSansBold'; ctx.fillText(`${rate}%`, centerX, centerY-5);
      ctx.fillStyle = '#7F8C8D'; ctx.font='9px GmarketSansBold'; ctx.fillText('완료율', centerX, centerY+11);
    }

    function renderTodoList() {
      const container = document.getElementById('todoList');
      const tasks = appData[formatDateKey(currentDateObj)] || [];
      container.innerHTML = '';
      if (tasks.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#A0AEC0; padding:20px; font-size:0.8rem;">일정이 없습니다.</div>`;
        return;
      }
      tasks.sort((a,b) => (a.startH*60+a.startM) - (b.startH*60+b.startM)).forEach(t => {
        const item = document.createElement('div');
        item.className = 'todo-item';
        item.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})">
            <span class="todo-badge">${String(t.startH).padStart(2,'0')}:${String(t.startM).padStart(2,'0')}~${String(t.endH).padStart(2,'0')}:${String(t.endM).padStart(2,'0')}</span>
            <span class="todo-text ${t.completed ? 'completed' : ''}">${t.title}</span>
          </div>
          <div class="todo-actions">
            <button class="btn-icon btn-edit" onclick="editTask(${t.id})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-icon btn-delete" onclick="deleteTask(${t.id})"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 탭 전환 및 대시보드 로직 (기존 로직 유지)
    function switchTab(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(t)));
      document.getElementById('plannerTab').style.display = t === 'planner' ? 'block' : 'none';
      document.getElementById('dashboardTab').style.display = t === 'dashboard' ? 'block' : 'none';
      if (t === 'dashboard') renderDashboard();
    }

    let weeklyChartInstance = null, hourlyChartInstance = null;
    function renderDashboard() {
      const last7 = []; for (let i=6; i>=0; i--) { const d=new Date(); d.setDate(d.getDate()-i); last7.push(formatDateKey(d)); }
      let tot=0, done=0, rates=[], hMiss=new Array(24).fill(0);
      last7.forEach(k => {
        const ts = appData[k] || []; tot += ts.length; done += ts.filter(t=>t.completed).length;
        rates.push(ts.length > 0 ? Math.round((ts.filter(t=>t.completed).length/ts.length)*100) : 0);
        ts.filter(t=>!t.completed).forEach(t => { for(let h=t.startH; h<t.endH; h++) if(h<24) hMiss[h]++; });
      });
      document.getElementById('weeklyRate').innerText = `${tot > 0 ? Math.round((done/tot)*100) : 0}%`;
      const maxM = Math.max(...hMiss); document.getElementById('weakestHour').innerText = maxM > 0 ? `${hMiss.indexOf(maxM)}시` : '--시';
      
      const c1 = document.getElementById('weeklyChart').getContext('2d');
      if (weeklyChartInstance) weeklyChartInstance.destroy();
      weeklyChartInstance = new Chart(c1, { type:'line', data:{ labels:last7.map(k=>k.slice(5)), datasets:[{label:'달성률', data:rates, borderColor:'#3B7A57', fill:true, backgroundColor:'rgba(59,122,87,0.1)'}] }, options:{ responsive:true, maintainAspectRatio:false } });
      
      const c2 = document.getElementById('hourlyChart').getContext('2d');
      if (hourlyChartInstance) hourlyChartInstance.destroy();
      hourlyChartInstance = new Chart(c2, { type:'bar', data:{ labels:Array.from({length:24},(_,i)=>`${i}시`), datasets:[{label:'미달성', data:hMiss, backgroundColor:'#F4D03F'}] }, options:{ responsive:true, maintainAspectRatio:false } });
    }
  </script>
</body>
</html>
